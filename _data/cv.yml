bio: >-
  Jacopo Ciambella is Associate Professor of Solid and Structural Mechanics in
  the Department of Structural and Geotechnical Engineering at Sapienza
  University of Rome. He received his PhD in Structural Engineering from
  Sapienza in 2010, with a thesis on the experimental testing and nonlinear
  viscoelastic modelling of filled rubber developed in industrial
  collaboration, which received the Sapienza Doctoral Award for the best PhD
  dissertation in Engineering. He was Lecturer in Composites Engineering at the
  University of Bristol (2012–2013) and a Visiting Fellow there until 2017. His
  research addresses the finite-strain mechanics of soft dissipative solids –
  nonlinear viscoelasticity and viscoplasticity, physics-augmented neural
  constitutive models, fracture of elastomers and magneto-active materials –
  as well as vibration-based structural identification. He serves on the
  editorial boards of Scientific Reports and Applications in Engineering
  Science, is Associate Editor of Frontiers in Materials, and holds the Italian
  National Scientific Qualification as Full Professor.

